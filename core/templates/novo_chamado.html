{% extends 'base.html' %}

{% block title %}Novo Chamado | NETFLOWBR{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
        <div class="card shadow-lg border-0">
            <div class="card-header py-3 bg-primary text-white">
                <h5 class="mb-0 text-center text-uppercase fw-bold">Abertura de Ticket</h5>
            </div>
            <div class="card-body p-4">
                <form method="POST">
                    {% csrf_token %}
                    
                    {% for field in form %}
                        {% if field.name == 'prioridade' %}
                            <div class="form-check mb-3 mt-2">
                                {{ field }}
                                <label class="form-check-label fw-bold ms-2" for="{{ field.id_for_label }}">
                                    {{ field.label }}
                                </label>
                            </div>
                        {% else %}
                            <div class="mb-3">
                                <label class="form-label fw-semibold text-secondary">{{ field.label }}</label>
                                {{ field }}
                            </div>
                        {% endif %}
                    {% endfor %}

                    <div class="d-grid gap-2 mt-4">
                        <button type="submit" class="btn btn-primary py-2 fw-bold">Salvar Chamado</button>
                        <a href="{% url 'lista_chamados' %}" class="btn btn-outline-secondary">Cancelar</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}<html xmlns:mso="urn:schemas-microsoft-com:office:office" xmlns:msdt="uuid:C2F41010-65B3-11d1-A29F-00AA00C14882"><head>
